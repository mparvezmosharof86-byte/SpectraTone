name: Build SpectraTone APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    - name: Compile and Assemble APK
      run: gradle assembleDebug

    - name: Publish Direct APK (No ZIP)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk SpectraTone.apk
        gh release delete latest --yes || true
        git push --delete origin latest || true
        gh release create latest SpectraTone.apk --title "SpectraTone Latest APK" --notes "Direct APK download for Android - No ZIP."

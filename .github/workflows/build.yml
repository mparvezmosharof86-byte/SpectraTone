name: Build SpectraTone APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    - name: Compile APK Only
      run: gradle assembleDebug

    - name: Publish Direct APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "SpectraTone v1.0.0"
        body: "Direct APK File - Fast Build for Mobile Testing."
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
